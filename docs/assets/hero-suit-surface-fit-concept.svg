  <path class="base" d="M211 118c25 0 40 17 40 39 0 20-12 35-31 42v45c30 10 51 37 54 73l12 184c2 28-9 55-28 70h-25c6-53 1-103-9-153h-27c-10 50-15 100-9 153h-25c-19-15-30-42-28-70l12-184c3-36 24-63 54-73v-45c-19-7-31-22-31-42 0-22 16-39 41-39z"/>
  <path class="line" d="M196 132c21 28 37 64 45 106M178 290c43 24 77 53 101 86M151 422c38-8 78-9 120-4M181 520c24 9 43 23 58 42"/>
  <path class="armor" d="M181 270c36-24 72-24 108 0l-15 94c-42 18-75 18-101 0z"/>
  <path class="armor" d="M168 370c52 17 101 17 146 0l-12 58c-38 12-77 12-118 0z"/>
  <path class="armor" d="M169 548h46l9 41h-62z"/>
  <path class="armor" d="M228 548h46l7 41h-60z"/>
  <path class="guide" d="M309 96v502"/>
  <path class="arrow" d="M315 354c-25 0-44-9-55-28"/>
  <text class="tag" x="64" y="642">判定: 横から見て胸/腰/足が体表に沿う</text>

  <rect class="panel" x="430" y="36" width="340" height="640" rx="10"/>
  <text class="note" x="456" y="76">B. 背面: 背中は薄板にしない</text>
  <text class="sub" x="456" y="104">肩甲骨パッド + 脊椎キール + 腰クラスプ</text>
  <ellipse class="shadow" cx="600" cy="626" rx="72" ry="14"/>
  <path class="base" d="M600 118c25 0 40 17 40 39 0 22-13 37-34 43v39c34 8 59 37 63 79l12 190c2 29-10 55-29 69h-27c7-55 1-106-10-156h-30c-11 50-17 101-10 156h-27c-19-14-31-40-29-69l12-190c4-42 29-71 63-79v-39c-21-6-34-21-34-43 0-22 15-39 40-39z"/>
  <path class="line" d="M600 128v451M553 276c31 12 62 17 94 0M542 423c39 15 79 15 120 0"/>
  <path class="armor" d="M547 244c35-26 71-27 108-1l26 95c-54 31-108 31-160 0z"/>
