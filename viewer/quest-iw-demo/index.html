<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAVAI Quest変身デモ</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="stage">
      <div id="xrRoot" class="xr-root" aria-label="Quest没入シーン"></div>

      <section class="hud" aria-label="Quest変身デモ操作">
        <p class="eyebrow">IWSDK / mocopi / Sakura AI Engine 連携</p>
        <h1>生成装着</h1>
        <p id="status" class="status">Quest 3 VR準備OK。4桁コードを呼び出し、音声合図で変身します。</p>
        <div class="meter" aria-hidden="true"><span id="meterFill"></span></div>
        <p id="operatorStateHelp" class="operator-state-help">黄: 待機中です。4桁コード、マイク、VR開始の順に確認してください。</p>
        <div class="route-panel" aria-label="変身体験ルート状態">
          <span id="routeMode">生成: ローカル</span>
          <span id="routeApi">適合検査: 待機</span>
          <span id="routeTrial">変身試験: 待機</span>
          <span id="routeReplay">記録保管: 待機</span>
        </div>
        <p id="routeContract" class="route-contract">体型適合: 待機 / 表面処理: 待機</p>
        <div class="recall-dock" aria-label="Questスーツ呼び出し">
          <div class="recall-head">
            <span class="recall-kicker">Quest呼び出し</span>
            <label for="recallCodeInput">4桁コード</label>
          </div>
          <div class="recall-entry">
            <input
              id="recallCodeInput"
              type="text"
              inputmode="text"
              maxlength="4"
              placeholder="A1B2"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              enterkeyhint="go"
              aria-describedby="recallCodeState"
            />
            <button id="btnLoadRecallCode" type="button">呼び出す</button>
          </div>
          <span id="recallCodeState">4桁コード未指定</span>
        </div>
        <div class="actions">
          <button id="btnEnterVR" type="button">VR開始</button>
          <button id="btnVoice" type="button">音声</button>
          <button id="btnReplay" type="button">記録再生</button>
          <button id="btnReplayView" type="button">鏡</button>
          <button id="btnPause" type="button">停止</button>
          <button id="btnReset" type="button">リセット</button>
        </div>
        <p id="micState" class="mic-state">音声処理はローカルAPI経路で待機します。</p>
        <p id="voiceLine" class="voice-line"></p>
        <details id="debugPanel" class="debug-panel">
          <summary>音声デバッグ</summary>
          <pre id="voiceDebug">音声待機中。</pre>
        </details>
      </section>

      <section class="readout" aria-label="セッション状態">
        <span id="sessionId">セッション: 待機</span>
        <span id="triggerState">音声: 待機</span>
        <span id="equipState">変身: 待機</span>
      </section>
    </main>
    <script type="module" src="./quest-demo.js"></script>
  </body>
</html>
