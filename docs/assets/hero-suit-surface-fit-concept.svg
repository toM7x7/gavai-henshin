  <path class="armor" d="M525 348c51 21 101 21 151 0l-10 74c-43 15-86 15-129 0z"/>
  <path class="guide" d="M492 95v505M709 95v505"/>
  <path class="arrow" d="M704 280c-33 4-60 2-80-7"/>
  <text class="tag" x="456" y="642">判定: 背面が肩甲骨から腰まで連続し、厚みが見える</text>

  <rect class="panel" x="824" y="36" width="340" height="640" rx="10"/>
  <text class="note" x="850" y="76">C. ブーツ: 足元は接地と重心</text>
  <text class="sub" x="850" y="104">足を包むソール + 足首カフ + すね受け</text>
  <line x1="876" y1="594" x2="1116" y2="594" stroke="#d6c278" stroke-width="5"/>
  <path class="human" d="M962 150c16 132 18 254 7 365l-20 58h-34l20-64c8-119 6-237-7-354z"/>
  <path class="human" d="M1028 150c-16 132-18 254-7 365l20 58h34l-20-64c-8-119-6-237 7-354z"/>
  <path class="base" d="M945 150c15 133 17 254 8 352l-19 69h-23l19-68c8-115 5-234-8-349z"/>
  <path class="base" d="M1045 150c-15 133-17 254-8 352l19 69h23l-19-68c-8-115-5-234 8-349z"/>
  <path class="armor" d="M900 497h74l18 79h-103z"/>
  <path class="armor" d="M1016 497h74l20 79h-105z"/>
  <path class="armor" d="M907 560h112l22 34H877z"/>
  <path class="armor" d="M1023 560h112l23 34h-166z"/>
  <path class="line" d="M934 510c24 10 44 10 61 0M1050 510c24 10 44 10 61 0"/>
  <path class="guide" d="M994 128v466"/>
  <path class="arrow" d="M1050 594c-17-39-16-72 3-97"/>
  <text class="tag" x="850" y="642">判定: 底面が床に乗り、すね装甲へ受けが続く</text>
</svg>
