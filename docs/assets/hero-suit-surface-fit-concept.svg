<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Hero suit surface-fit concept sheet</title>
  <desc id="desc">A schematic showing a human silhouette, base body suit texture, body-wrapped armor shells, pelvis belt loop, dorsal shell, and grounded boot cuff.</desc>
  <defs>
    <linearGradient id="baseSuit" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1251b8"/>
      <stop offset="1" stop-color="#24b4c6"/>
    </linearGradient>
    <linearGradient id="armorShell" x1="0" x2="1">
      <stop offset="0" stop-color="#f9fff0"/>
      <stop offset="1" stop-color="#c9f353"/>
    </linearGradient>
    <style>
      .bg { fill: #f7faf4; }
      .panel { fill: rgba(255,255,255,0.72); stroke: #d9e4d6; stroke-width: 2; }
      .human { fill: #f1d0aa; opacity: 0.42; stroke: #b77d5a; stroke-width: 1.5; }
      .base { fill: url(#baseSuit); opacity: 0.86; stroke: #093a54; stroke-width: 2; }
      .line { fill: none; stroke: #aaff20; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
      .armor { fill: url(#armorShell); opacity: 0.82; stroke: #8a9d14; stroke-width: 2.4; }
      .shadow { fill: #06213a; opacity: 0.16; }
      .guide { fill: none; stroke: #16a4b5; stroke-width: 2; stroke-dasharray: 8 8; opacity: 0.65; }
      .arrow { stroke: #21302e; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
      .note { font-family: system-ui, sans-serif; font-size: 18px; fill: #1d2b29; font-weight: 700; }
      .sub { font-family: system-ui, sans-serif; font-size: 14px; fill: #53615f; }
      .tag { font-family: system-ui, sans-serif; font-size: 13px; fill: #0d3d46; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#21302e"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>

  <rect class="panel" x="36" y="36" width="340" height="640" rx="10"/>
  <text class="note" x="62" y="76">A. 側面: 置くのではなく着る</text>
  <text class="sub" x="62" y="104">人体表面 → 基礎スーツ → 外装シェル</text>
  <ellipse class="shadow" cx="210" cy="626" rx="74" ry="14"/>
